name: Agent Standards Sync

on:
  pull_request:
    paths:
      - AGENTS.md
      - .github/copilot-instructions.md
      - .github/instructions/**
      - .github/prompts/**
      - .github/agent-standards/**
      - scripts/sync-agent-standards.ps1
      - scripts/sync-agent-standards.sh
  workflow_dispatch:
    inputs:
      apply:
        description: Apply, commit, and push generated child-repo standards updates
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: agent-standards-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Preview generated standards drift
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
          token: ${{ github.token }}

      - name: Require checked-in preview implementation
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/sync-agent-standards.ps1 ] || [ ! -f .gitmodules ]; then
            echo "::error::Agent standards sync preview is unavailable: checked-in sync script and submodule manifest are required."
            exit 1
          fi

      - name: Preview drift
        id: preview
        shell: pwsh
        continue-on-error: true
        run: ./scripts/sync-agent-standards.ps1 -Check -All

      - name: Summarize preview
        shell: bash
        run: |
          {
            echo "## Agent standards sync preview"
            echo
            if [ "${{ steps.preview.outcome }}" = "success" ]; then
              echo "Generated child-repo standards are already synchronized."
            else
              echo "Generated child-repo standards would change after this PR lands."
              echo
              echo "Applying drift requires protected-main manual dispatch, independent environment approval, and explicit enablement."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply generated standards (disabled pending PR-based design)
    if: github.event_name == 'workflow_dispatch' && inputs.apply == 'true' && github.ref == 'refs/heads/main' && github.repository == 'LATTIX-IO/savant' && vars.SAVANT_AGENT_STANDARDS_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: savant-release
    steps:
      - name: Refuse unsafe cross-repository mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Agent standards apply is disabled until the missing sync tools exist and a reviewer-protected branch/PR promotion flow replaces direct push to protected main."
          exit 1
