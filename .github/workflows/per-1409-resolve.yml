name: PER-1409 one-shot lockfile resolution

on:
  push:
    branches:
      - feature/per-1409-dependency-remediation
    paths:
      - .github/workflows/per-1409-resolve.yml
      - apps/web/package.json
      - pnpm-workspace.yaml

permissions:
  contents: write

jobs:
  resolve:
    if: github.repository == 'LATTIX-IO/savant' && github.ref == 'refs/heads/feature/per-1409-dependency-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feature/per-1409-dependency-remediation
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Regenerate frozen lockfile without installing dependencies
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit reviewed lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'savant-ci-lockfile'
          git config user.email 'savant-ci-lockfile@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'build(PER-1409): regenerate pnpm lockfile for patched Next.js'
            git push origin HEAD:refs/heads/feature/per-1409-dependency-remediation
          fi
