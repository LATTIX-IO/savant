name: Release source verification

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Exact Savant root package version tag (vX.Y.Z)
        required: true
        type: string

# Intentionally no workflow_run: normal main CI must never publish or trigger releases.
# This workflow only verifies provenance and uploads an internal attestation artifact.
# Publishing is not enabled until a separate, explicit approved release workflow exists.
permissions:
  contents: read

concurrency:
  group: savant-release-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source provenance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release trigger, exact package version and source commit
        env:
          SAVANT_RELEASE_VERSION: ${{ inputs.version }}
          SAVANT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release-verify.mjs
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
          run_install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Node unit and regression suites
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Scan committed secrets
        run: pnpm run security:secrets
      - name: Upload verification evidence (not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: savant-source-verification
          path: release-provenance.json
          if-no-files-found: error
          retention-days: 30
