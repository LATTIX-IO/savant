name: Savant TypeScript quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: savant-typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  savant:
    name: Savant unit, type, lint, build and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Savant
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Test all Node contract and application suites
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Reject committed secrets
        run: pnpm run security:secrets
