name: Savant TypeScript quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: savant-typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  savant:
    name: Savant unit, type, lint, build and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Savant
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Verify immutable GitHub Actions pins and negative security regression
        run: |
          node --test scripts/verify-github-actions-pins.test.mjs
          node scripts/verify-github-actions-pins.mjs

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Test all Node contract and application suites
        run: pnpm test

      - name: Python telemetry SDK conformance and fault tests
        run: python3 -m unittest discover -s sdks/python -p 'test_*.py'

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Reject committed secrets
        run: pnpm run security:secrets

  dependency-audit:
    name: Blocking production dependency audit (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Savant
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Fail for high/critical production advisories
        run: pnpm run security:deps

  workflow-postgres:
    name: Workflow schema migration and tenant integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: savant
          POSTGRES_USER: savant
          POSTGRES_PASSWORD: integration_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U savant -d savant"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: savant
      PGPASSWORD: integration_only
      PGDATABASE: savant
      DATABASE_URL: postgresql://savant@127.0.0.1:5432/savant
      SAVANT_WORKFLOW_SCHEMA_TEST: "1"
      SAVANT_HARNESS_SCHEMA_TEST: "1"
    steps:
      - name: Checkout Savant
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Reapply migrations to prove idempotency
        run: pnpm db:migrate
      - name: Verify durable harness invocation tenant, quota, race and replay invariants
        run: pnpm --filter @savant/web exec node ./scripts/verify-harness-reservations.mjs
      - name: Verify tenant signing key vault binding, rotation and revocation
        run: pnpm --filter @savant/web exec node ./scripts/verify-harness-signing-keys.mjs
      - name: Verify concurrent worker dispatch leases, fencing and backoff
        run: pnpm --filter @savant/web exec node ./scripts/verify-harness-dispatch-leases.mjs
      - name: Verify authorized DB-backed customer harness dispatch and uncertain outcome recovery
        run: pnpm --filter @savant/web exec node ./scripts/verify-harness-dispatch-worker.mjs
      - name: Verify tenant-authenticated provider idempotency reconciliation evidence
        run: pnpm --filter @savant/web exec node ./scripts/verify-harness-provider-reconciliation.mjs
      - name: Verify signed customer harness status through isolated reconciliation DB
        run: pnpm --filter @savant/web exec node ./scripts/verify-harness-signed-status.mjs
      - name: Verify tenant connector configuration, CAS and outbound egress policy
        run: pnpm --filter @savant/web exec node ./scripts/verify-harness-status-connector-config.mjs
      - name: Verify Azure Key Vault tenant-pinned HMAC through signed status and PostgreSQL
        run: pnpm --filter @savant/web exec node ./scripts/verify-harness-azure-vault.mjs

      - name: Test tenant FK, revision uniqueness, transaction rollback and cascade
        run: pnpm --filter @savant/web exec node ./scripts/verify-workflow-schema.mjs
      - name: Verify capability reference ACL, cross-tenant denial and p95
        run: pnpm --filter @savant/web exec node ./scripts/verify-capability-access.mjs
      - name: Verify artifact-level grants and denials before provider IO
        run: pnpm --filter @savant/web exec node ./scripts/verify-artifact-permissions.mjs
      - name: Verify policy admin tenant grants, revisions, retries and atomic audit
        run: pnpm --filter @savant/web exec node ./scripts/verify-capability-policy-admin.mjs
      - name: Verify immutable evaluation enqueue, default-branch race and cross-tenant denial
        run: pnpm --filter @savant/web exec node ./scripts/verify-eval-source-pinning.mjs
        env:
          SAVANT_EVAL_SOURCE_TEST: "1"
      - name: Verify encrypted Test Bench source pinning, tenant isolation, CAS and audit
        run: pnpm --filter @savant/web exec node ./scripts/verify-test-bench-definitions.mjs
        env:
          SAVANT_TEST_BENCH_SCHEMA_TEST: "1"
      - name: Verify observed NIM/Jev Test Bench run evidence, immutable snapshot and unsafe-retry denial
        run: pnpm --filter @savant/web exec node ./scripts/verify-observed-test-bench-runs.mjs
        env:
          SAVANT_OBSERVED_TEST_BENCH_TEST: "1"
      - name: Verify tenant cancellation, queued de-claim, provider stop gates and race safety
        run: pnpm --filter @savant/web exec node ./scripts/verify-cancel-observed-test-bench-runs.mjs
        env:
          SAVANT_OBSERVED_CANCELLATION_TEST: "1"
      - name: Verify paired real-run QA comparison, tenant isolation and encrypted provenance
        run: pnpm --filter @savant/web exec node ./scripts/verify-observed-run-comparison.mjs
        env:
          SAVANT_OBSERVED_COMPARISON_TEST: "1"
      - name: Verify BYO OpenAI tenant execution, credential rotation and no platform fallback
        run: pnpm --filter @savant/web exec node ./scripts/verify-tenant-openai-test-bench.mjs
        env:
          SAVANT_TENANT_OPENAI_TEST: "1"
      - name: Verify v1 legacy to v2 key-ID migration, retained HMAC and PostgreSQL recovery
        run: pnpm --filter @savant/web exec node ./scripts/verify-versioned-keyring-persistence.mjs
        env:
          SAVANT_V2_KEYRING_SCHEMA_TEST: "1"
      - name: Verify bounded tenant ciphertext rewrap, concurrent resume, atomic rollback and audit
        run: pnpm --filter @savant/web exec node ./scripts/verify-managed-ciphertext-rewrap.mjs
        env:
          SAVANT_CIPHER_REWRAP_TEST: "1"
          SAVANT_REWRAP_EPHEMERAL_DATABASE: "1"
      - name: Verify encrypted full PostgreSQL backup/restore for v1/v2 and preserved replay
        run: |
          command -v pg_dump
          command -v pg_restore
          command -v createdb
          command -v dropdb
          pnpm --filter @savant/web exec node ./scripts/verify-ephemeral-db-backup-restore.mjs
        env:
          SAVANT_EPHEMERAL_RESTORE_TEST: "1"
          CI: "true"
      - name: Verify signature-gated crypto maintenance DB admission, replay holds and immutable audit
        run: pnpm --filter @savant/web exec node ./scripts/verify-crypto-maintenance-admission.mjs
        env:
          SAVANT_CRYPTO_MAINTENANCE_DB_TEST: "1"
          CI: "true"
      - name: Verify UTC tenant daily admissions, idempotency, races and no-refund controls
        run: pnpm --filter @savant/web exec node ./scripts/verify-observed-daily-quota.mjs
        env:
          SAVANT_DAILY_QUOTA_TEST: "1"
      - name: Verify global provider capacity reservations, contention and rollback
        run: pnpm --filter @savant/web exec node ./scripts/verify-platform-provider-admission.mjs
        env:
          SAVANT_GLOBAL_PROVIDER_ADMISSION_TEST: "1"
      - name: Verify immutable provider-reported token receipts, partial usage and cross-tenant refusal
        run: pnpm --filter @savant/web exec node ./scripts/verify-observed-provider-usage.mjs
        env:
          SAVANT_PROVIDER_USAGE_TEST: "1"
      - name: Verify pre-egress intent fencing, unknown usage and cross-tenant denial
        run: pnpm --filter @savant/web exec node ./scripts/verify-provider-call-intents.mjs
        env:
          SAVANT_PROVIDER_INTENT_TEST: "1"
      - name: Verify approved rates, tenant budgets, races and fail-closed monetary admission
        run: pnpm --filter @savant/web exec node ./scripts/verify-test-bench-monetary-admission.mjs
        env:
          SAVANT_MONETARY_ADMISSION_TEST: "1"
          SAVANT_MONETARY_EPHEMERAL_DATABASE: "1"
      - name: Verify immutable billing source ingestion and tenant-safe reconciliation evidence
        run: pnpm --filter @savant/web exec node ./scripts/verify-test-bench-billing-evidence.mjs
        env:
          SAVANT_BILLING_SOURCE_TEST: "1"
          SAVANT_BILLING_EPHEMERAL_DATABASE: "1"
