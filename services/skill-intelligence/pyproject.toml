[project]
name = "savant-skill-intelligence"
version = "0.1.0"
description = "Savant Skill Intelligence worker: dataset curation, SkillOpt orchestration, and candidate validation."
requires-python = ">=3.11"
dependencies = ["savant-skillopt-adapter"]

[project.optional-dependencies]
dev = ["pytest>=8"]
skillopt = ["savant-skillopt-adapter[skillopt]"]

[project.scripts]
savant-skill-intelligence = "savant_skill_intelligence.__main__:main"

[tool.uv.sources]
savant-skillopt-adapter = { path = "../skillopt-adapter", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/savant_skill_intelligence"]

[tool.pytest.ini_options]
pythonpath = ["src", "../skillopt-adapter/src"]
testpaths = ["tests"]
