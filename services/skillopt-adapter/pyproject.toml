[project]
name = "savant-skillopt-adapter"
version = "0.1.0"
description = "Stable adapter boundary between Savant's domain model and a pinned Microsoft SkillOpt engine."
requires-python = ">=3.11"
license = { text = "Proprietary; bundles no SkillOpt code (SkillOpt is MIT, see THIRD_PARTY_NOTICES.md)" }
dependencies = []

[project.optional-dependencies]
# The real engine. Pinned exactly: SkillOpt is alpha software and moves quickly.
# Features newer than the PyPI release require a pinned source commit instead
# (see skillopt.lock.toml -> engine.source_commit).
skillopt = ["skillopt==0.2.0"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/savant_skillopt_adapter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
